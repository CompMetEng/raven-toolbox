name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that obsoletes a previous run cancels it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # Pinned so the lint result is reproducible (unpinned ruff silently
      # adds rules over time). Keep in sync with the ``dev`` extra in pyproject.
      - run: pip install ruff==0.15.15
      - run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # Installs runtime deps + the dev extra (mypy). Third-party stubs are
      # absent for cobra/optlang/scipy; ignore_missing_imports handles that.
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # backstop so a hang cannot burn hours of runner time
    strategy:
      fail-fast: false
      matrix:
        # Full Python range on Linux; a single Python on macOS/Windows to catch
        # OS-specific issues (paths, subprocess, file I/O) at low runner cost.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # ``-e .[dev,excel]`` so every optional extra is exercised.
      # Gurobi is not installable on free runners; the relevant tests
      # skip themselves when ``optlang.gurobi_interface`` cannot import.
      - run: pip install -e ".[dev,excel]"
      # -v streams each test id as it runs (so a hang is obvious), and
      # pytest-timeout fails any test stuck >300s with a full thread dump
      # (thread method works on Windows/macOS) instead of hanging the job.
      - name: Run pytest
        run: pytest -v --durations=20 --timeout=300 --timeout-method=thread
        env:
          PYTHONUNBUFFERED: "1"

  parity:
    name: parity vs MATLAB RAVEN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # RAVEN is GPL and this package is MIT, so its files are never vendored
      # here -- the cross-language checks read them from a checkout instead.
      # develop is the RAVEN branch raven-docs documents and raven-toolbox tracks.
      - name: Check out MATLAB RAVEN
        uses: actions/checkout@v5
        with:
          repository: CompMetEng/RAVEN
          ref: develop
          path: .raven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # gurobipy ships a size-limited licence (2000 variables / 2000
      # constraints). That is useless at genome scale but ample for the small
      # fixtures here, and it gives the cross-solver check a second solver to
      # compare against. Genome-scale work runs in parity-nightly.yml, which
      # uses a WLS licence.
      - run: pip install -e ".[dev]" gurobipy
      # -rs reports what skipped: oracle-backed checks skip until someone runs
      # scripts/parity/generate_oracles.m in MATLAB, and that should be visible
      # in the log rather than looking like coverage that exists.
      - name: Run parity checks
        run: pytest -m "parity and not slow" -v -rs --timeout=600 --timeout-method=thread
        env:
          RAVEN_ROOT: ${{ github.workspace }}/.raven
          PYTHONUNBUFFERED: "1"


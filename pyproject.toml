[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raven-toolbox"
version = "3.0.0b1"
description = "Reconstruction, Analysis and Visualization of Metabolic Networks in Python, a port of the RAVEN Toolbox built on cobrapy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eduard Kerkhoven", email = "eduardk@chalmers.se" },
]
keywords = [
    "genome-scale-model",
    "metabolic-model",
    "reconstruction",
    "raven",
    "cobra",
    "systems-biology",
    "constraint-based-modeling",
    "kegg",
    "metacyc",
    "tinit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "cobra>=0.29",
    "numpy>=1.21",
    "pandas>=2",
    "scipy>=1.10",
    "ruamel.yaml>=0.17",
    "requests>=2.28",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pytest-timeout>=2.1",
    "ruff==0.15.15",
    "mypy>=1.8",
]
excel = [
    "openpyxl>=3.1",
]

[project.scripts]
raven-toolbox-binaries = "raven_toolbox.binaries_cli:main"

[project.urls]
Homepage = "https://github.com/CompMetEng/raven-toolbox"
Source = "https://github.com/CompMetEng/raven-toolbox"
Issues = "https://github.com/CompMetEng/raven-toolbox/issues"
"RAVEN MATLAB" = "https://github.com/CompMetEng/RAVEN"

[tool.hatch.build.targets.wheel]
packages = ["src/raven_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "parity: cross-language checks against MATLAB RAVEN (see tests/parity/README.md)",
    "slow: needs a genome-scale model and a solver licence that accepts it; run nightly, not in the pull-request suite",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/raven_toolbox"]
# cobra / optlang / scipy / ruamel ship no type stubs; don't error on their imports.
ignore_missing_imports = true

# numpy >= 2.5 ships PEP 695 `type` statements in its bundled stubs, which mypy rejects under
# python_version 3.11 ("Type statement is only supported in Python 3.12 and greater"). Skip numpy's
# stubs so the check stays on 3.11 for our own code rather than weakening it to 3.12.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
